name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FairShare.sln

      - name: Build
        run: dotnet build FairShare.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FairShare.sln --configuration Release --no-build --verbosity normal

  # Every merge to main publishes ghcr.io/jjwren/fairshare-{api,web}:main - the image the TEST
  # stack tracks. Releases publish the versioned (pinnable) tags from release.yml.
  publish-main:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job may push packages; build/test runs (incl. PRs) get the read-only default.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # SEO snapshots (#173): boot the stack from this checkout, render the public routes
      # into snapshots/ with headless Chromium, and tear the stack down - the image builds
      # below bake the rendered files into /_snapshot/ (see src/FairShare.Web/Dockerfile).
      # The renderer exits non-zero on any missing or shell-captured route, failing the
      # publish rather than shipping a snapshot-less image.
      - name: Render SEO snapshots
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SIGNING_KEY=$|JWT_SIGNING_KEY=$(openssl rand -base64 48)|" .env
          docker compose up -d --build --wait --wait-timeout 180
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/render-seo-snapshots.mjs
          docker compose down -v
          rm -f .env

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :main images
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for app in api web; do
            IMAGE="ghcr.io/${OWNER}/fairshare-${app}"
            DOCKERFILE="src/FairShare.$( [ "$app" = api ] && echo Api || echo Web )/Dockerfile"
            docker build -f "$DOCKERFILE" -t "${IMAGE}:main" -t "${IMAGE}:sha-${GITHUB_SHA::7}" .
            docker push "${IMAGE}:main"
            docker push "${IMAGE}:sha-${GITHUB_SHA::7}"
          done
