<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FairShare is a free child-support calculator: transparent, line-by-line estimates under your state's official guidelines, matching the court's own worksheets." />
    <!-- Share cards: og:url is the canonical origin, not the requested path, because this
         same shell serves every route. og:description is the same string as the
         description meta above - one string, edited in both places or not at all.
         Image URLs must be absolute (scrapers resolve nothing); og-card.png is generated
         at 1200x630, the standard large-card size. -->
    <meta property="og:site_name" content="FairShare" />
    <meta property="og:title" content="FairShare - free child-support calculator" />
    <meta property="og:description" content="FairShare is a free child-support calculator: transparent, line-by-line estimates under your state's official guidelines, matching the court's own worksheets." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://easychildsupport.fyi/" />
    <meta property="og:image" content="https://easychildsupport.fyi/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FairShare - free child-support calculator, line-by-line estimates matching the court's own worksheets" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://easychildsupport.fyi/og-card.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212529" media="(prefers-color-scheme: dark)" />
    <title>FairShare</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="js/theme-init.js"></script>
</head>

<body>
    <div id="app">
        <!-- Real content, not just a spinner: crawlers and reviewers that don't run
             JavaScript (Google's OAuth verification among them) must still see the app
             name, its purpose, and a privacy-policy link. Blazor replaces this on boot. -->
        <div class="container my-5 text-center">
            <h1 class="h3 mb-2">FairShare</h1>
            <p class="lead mx-auto mb-3" style="max-width: 640px;">
                A free child-support calculator: transparent, line-by-line estimates under your
                state's official guidelines, matching the court's own worksheets.
            </p>
            <p class="mb-4">
                <a href="/privacy">Privacy Policy</a> &middot;
                <a href="/terms">Terms of Use</a> &middot;
                <a href="/support">Support</a>
            </p>
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss error">🗙</button>
    </div>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
