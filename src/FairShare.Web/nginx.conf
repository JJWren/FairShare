# conf.d files are included at http level, so a map is legal here. The test host is a
# nightly-wiped duplicate of prod and must never be indexed; nginx omits a header whose
# value is empty, so prod hosts (and direct IP/localhost access) send nothing.
map $host $fairshare_robots {
    default "";
    "~*^test\." "noindex, nofollow";
}

server {
    # Both stacks: busybox wget (the compose healthcheck) resolves localhost to ::1
    # first on current nginx:alpine images, and a bare "listen 80" is IPv4-only.
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects (the trailing-slash rewrite below) must be relative: an absolute one is
    # built from this container's own listen port and http scheme, which is wrong both in
    # dev (host port mapping) and in prod (behind the TLS proxy it would bounce through
    # plain http).
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_types application/wasm application/javascript application/json application/octet-stream text/css text/javascript image/svg+xml;
    # The publish output ships .gz siblings for every framework asset - serve those
    # instead of re-compressing ~3MB of wasm at level 5 on every cold visit. (The .br
    # siblings need a brotli module the stock nginx:alpine lacks; a custom nginx build
    # isn't worth it when the .gz files are already there.)
    gzip_static on;
    gzip_vary on;

    # Unknown paths are real 404s (previously every typo and probe returned 200 with
    # the shell and got indexed as duplicates), but the 404 body is still the host page
    # so a person on a mistyped URL gets the app's own not-found screen. error_page
    # without "=" preserves the 404 status; the internal redirect lands on the
    # "location = /index.html" block below, so its no-cache and security headers apply.
    error_page 404 /index.html;

    # Security headers (CSP etc.). Re-included inside every location below that has
    # its own add_header: nginx's add_header inheritance is all-or-nothing, so a
    # location-level Cache-Control would otherwise silently drop these.
    include /etc/nginx/conf.d/fairshare-security-headers.inc;

    # Fingerprinted Blazor framework assets never change under the same name.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/fairshare-security-headers.inc;
        try_files $uri =404;
    }

    # The two UNfingerprinted entry files under /_framework/: they reference every
    # fingerprinted asset by name, so caching them immutable pins returning browsers
    # to the previous deployment forever. Exact matches outrank the prefix block.
    location = /_framework/blazor.webassembly.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/fairshare-security-headers.inc;
    }

    location = /_framework/dotnet.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/fairshare-security-headers.inc;
    }

    # The host page and runtime config must always be revalidated so deploys
    # and API_BASE_URL changes take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/fairshare-security-headers.inc;
    }

    location = /appsettings.json {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/fairshare-security-headers.inc;
    }

    # The app's own UNfingerprinted assets (js/site.js, css/site.css, app.css, vendored Bootstrap):
    # index.html references them by bare name, so without an explicit policy browsers apply
    # heuristic freshness and can keep last release's site.js under this release's SPA
    # (2.2.0's Excel export failed exactly that way: "fairshareDownload was undefined").
    # no-cache = revalidate every load; nginx's ETag makes an unchanged file a cheap 304.
    location ~ ^/(js|css|lib)/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/fairshare-security-headers.inc;
        try_files $uri =404;
    }

    location = /app.css {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/fairshare-security-headers.inc;
    }

    # SPA fallback ONLY for routes the app actually defines (the union of @page
    # directives; deeper segments like /States/AL/CS42 and /admin/users/edit/{id}
    # share these first segments). Adding a new top-level route requires adding it
    # here - a route missing from this list 404s in prod while working in dev.
    # SEO snapshots (#173): CI renders the public routes into /_snapshot/<path>.html;
    # a route with a snapshot serves it (crawlers see real per-route content, the WASM
    # app hydrates over it), everything else falls through to the shell exactly as
    # before. Snapshot HTML is per-release route content: no-cache like index.html.
    location ~* ^/(account|admin|guides|login|privacy|profiles|scenarios|states|support|terms)(/|$) {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/fairshare-security-headers.inc;
        # A trailing slash would probe /_snapshot/<path>/.html and miss the snapshot; the
        # app's route form has no trailing slash, so redirect to it (this also stops
        # crawlers indexing /privacy and /privacy/ as two URLs).
        rewrite ^(/.+)/$ $1 permanent;
        try_files /_snapshot$uri.html $uri /index.html;
    }

    # The home route's snapshot (the regex above can't match a bare "/").
    location = / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/fairshare-security-headers.inc;
        try_files /_snapshot/index.html /index.html;
    }

    # Everything else: real files are served, anything unknown is a genuine 404
    # (handled by error_page above).
    location / {
        try_files $uri $uri/ =404;
    }
}
